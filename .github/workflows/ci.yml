# Driver (درايفر) CI — plan docs/plans/2026-10-02-milestone-2-platform-core.md, Step 9.
# Two jobs, both against real Postgres+PostGIS and Redis service containers: `ci` (migrate, lint,
# typecheck, tests, build, smoke, simulate) and `e2e-postgres` (the built API on Postgres, five core
# flows, every error attributed to a flow, with the known-failures ratchet). How to read a failure and
# how to run the same thing locally: docs/ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels an older run on a PR branch, never on main: every main commit keeps a finished
# ci / e2e-postgres result, which the Deploy workflow requires before it ships that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    # The required check's name (migrate · lint · typecheck · test · build · smoke · simulate).
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: driver
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d driver"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Real Prisma engines here: no PRISMA_SCHEMA_ENGINE_BINARY=/bin/true stub (that escape hatch is for
    # offline laptops/sandboxes only — docs/ci.md). All secrets below are dummies for throwaway services.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driver
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driver_shadow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-else
      JWT_KID: ci
      PHONE_HASH_PEPPER: ci-only-dummy-pepper
      SMS_PROVIDER: fake
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        # Explicit bash => `bash -eo pipefail`, so `cmd | tee log` still fails the step when cmd fails.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Migration timestamps (scripts/ci/check-migrations.mjs)
        # Pull requests only: a migration this PR adds must not share a timestamp or be older than the
        # newest one on the base branch. On push to main it was already checked in its PR.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          node scripts/ci/check-migrations.mjs --base "origin/${GITHUB_BASE_REF}"

      - name: Enable pnpm (corepack, version from package.json "packageManager")
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (prisma generate with real engines)
        run: pnpm turbo run build --filter='./packages/*'

      - name: Migrate (prisma migrate deploy)
        run: pnpm db:migrate

      - name: Create shadow database for the drift check
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres driver_shadow

      - name: Drift check (migrations vs schema.prisma)
        # Exit 0 = migrations reproduce schema.prisma exactly; 2 = drift (the diff is printed above).
        run: pnpm db:drift

      - name: Seed
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Postgres + Redis)
        run: pnpm test:integration

      - name: Build API and console
        run: pnpm turbo run build --filter=@driver/api --filter=@driver/console

      - name: Smoke the built API (health.live answers, health.ready → db ok, redis ok)
        run: |
          PORT=3999 node apps/api/dist/main.js > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3999/trpc/health.live 2>/dev/null; then break; fi
            sleep 0.5
          done
          if ! curl -fsS http://localhost:3999/trpc/health.live | jq .; then
            echo "::error title=API smoke::driver-api never answered /trpc/health.live with 200"
            cat api.log
            exit 1
          fi
          body=$(curl -fsS http://localhost:3999/trpc/health.ready)
          echo "$body" | jq .
          if ! echo "$body" | jq -e '.result.data.json | .ok == true and .db == "ok" and .redis == "ok"' > /dev/null; then
            echo "::error title=API smoke::health.ready must report db: ok and redis: ok"
            cat api.log
            exit 1
          fi
          # The installed apps still probe health.ping; it must keep answering.
          curl -fsS -o /dev/null http://localhost:3999/trpc/health.ping

      - name: Simulate (pnpm sim --orders 2000 --seed 1 --ci)
        # Fails the job on a non-zero exit (any invariant violation). `--ci` is accepted but ignored until
        # Step 7 lands the Aziziyah simulator, which also writes simulation-report.json.
        timeout-minutes: 10
        run: pnpm sim --orders 2000 --seed 1 --ci 2>&1 | tee simulation.log

      - name: Upload simulation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: |
            simulation-report.json
            apps/api/simulation-report.json
          if-no-files-found: warn

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            api.log
            simulation.log
          if-no-files-found: ignore

  # W0 "Postgres truth": the BUILT API on real Postgres + Redis, driven over HTTP by
  # scripts/e2e/realdb-core.mjs (sign-in, food place, SOS, ride with a quote, share link with a driver).
  # Every error the API logs is pinned on a flow by its x-request-id prefix (or its order / trip /
  # incident / person ids); a failing flow passes only while it is listed in
  # scripts/e2e/known-failures.json, and a listed flow that passes fails the job (the list only shrinks).
  e2e-postgres:
    name: e2e-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: driver
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d driver"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driver
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driver_shadow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-else
      JWT_KID: ci
      PHONE_HASH_PEPPER: ci-only-dummy-pepper
      SMS_PROVIDER: fake
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # The seeded admin the flows sign in as to grant roles and dispatch (seed.ts `SEED_ADMIN_PHONE`).
      SEED_ADMIN_PHONE: '07700000099'
      E2E_ADMIN_PHONE: '07700000099'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack, version from package.json "packageManager")
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (prisma generate with real engines)
        run: pnpm turbo run build --filter='./packages/*'

      - name: Migrate (prisma migrate deploy)
        run: pnpm db:migrate

      - name: Seed (with the admin the flows use)
        run: pnpm db:seed

      - name: Build API
        run: pnpm turbo run build --filter=@driver/api

      - name: Core flows on Postgres (scripts/e2e/realdb-core.mjs)
        env:
          NODE_ENV: test
          LOG_FORMAT: json
          PORT: '3999'
          # About forty sign-ins (core + customer paths) from one address in a few seconds.
          OTP_RATE_LIMIT_PER_IP_HOUR: '10000'
          OTP_RATE_LIMIT_PER_DEVICE_HOUR: '10000'
          E2E_API_URL: http://localhost:3999
          E2E_API_LOG: api.log
        run: |
          : > api.log
          node apps/api/dist/main.js >> api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          body=''
          for _ in $(seq 1 60); do
            if body=$(curl -fsS http://localhost:3999/trpc/health.ping 2>/dev/null); then break; fi
            body=''
            sleep 0.5
          done
          if [ -z "$body" ] || ! echo "$body" | jq -e '.result.data.json.db == "ok"' > /dev/null; then
            echo "::error title=e2e-postgres::the API never answered health.ping with db: ok"
            echo "$body"
            cat api.log
            exit 1
          fi
          echo "$body" | jq -c '.result.data.json'
          node scripts/e2e/realdb-core.mjs

      - name: Upload API log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-postgres-api-log
          path: api.log
          if-no-files-found: ignore

  console-browser:
    # The Console in a real browser (CON-13, gate C10 in the Console build plan): sign in through
    # /login against the in-memory demo API, then every page in both themes at 1440×900 and 1366×768:
    # no page errors, no CSP violations, RTL Arabic, axe 0 serious/critical. Screenshots are uploaded.
    name: console · browser · axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages and the API (the demo API runs apps/api/dist in memory)
        run: pnpm turbo run build --filter='./packages/*' --filter=@driver/api

      - name: Install Chromium for Playwright
        run: pnpm --filter @driver/console exec playwright install --with-deps chromium

      - name: Browser checks (builds the Console, starts it and the demo API)
        run: pnpm --filter @driver/console e2e

      - name: Speed budget (JS per page, MapLibre only where a map is shown)
        if: ${{ !cancelled() }}
        run: pnpm --filter @driver/console budget

      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: console-browser
          path: |
            apps/console/e2e/.shots
            apps/console/e2e/.report
            apps/console/e2e/.results
          if-no-files-found: ignore
