# Driver (درايفر) — production deploy (docs/deploy/runbook.md).
#
# Runs on a version tag (git tag v1.2.3 && git push --tags) or by hand (Actions → Deploy → Run workflow).
# A tag always deploys production. By hand you pick the GitHub environment: `production` or `staging`
# (docs/deploy/staging.md). Each environment holds its own secrets and variables below, so staging has
# its own database, Fly apps and Pages projects and can never touch production's.
# Order: the commit's ci and e2e-postgres checks must have passed → migrate the database (DIRECT_URL) →
# deploy the API to Fly → smoke it → deploy the Console and the web apps. The websites never ship ahead of
# the API: the Vercel projects do not deploy on a push to main (vercel.json), only from here.
# Every part checks its own secrets first and SKIPS (green, with a notice) when they are not configured
# yet, so this workflow is safe to merge before any account exists.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   DIRECT_URL              Supabase direct / session connection string (migrations) — docs/deploy/supabase.md
#   DATABASE_CA_CERT        optional: Supabase's CA certificate (PEM) to verify TLS
#   FLY_API_TOKEN           `flyctl tokens create deploy -a driver-api` (and console) — docs/deploy/hosting.md
#   CLOUDFLARE_API_TOKEN    Pages "Edit" token; CLOUDFLARE_ACCOUNT_ID — docs/deploy/web.md
#   VERCEL_DEPLOY_HOOK_CUSTOMER / VERCEL_DEPLOY_HOOK_MERCHANT   each Vercel project's deploy hook for the
#                           branch main (unset: that site is skipped) — docs/deploy/vercel.md
# Variables (same page → Variables; not secret):
#   API_PUBLIC_URL          e.g. https://driver-api.fly.dev/trpc (what the web apps and the Console call)
#   FLY_API_APP             default driver-api;  FLY_CONSOLE_APP  e.g. driver-console (unset: no Console deploy)
#   SHARE_BASE_URL          public origin of the customer web app, e.g. https://driver-customer.pages.dev
#   CF_PAGES_CUSTOMER / CF_PAGES_PARTNER / CF_PAGES_MERCHANT   Pages project names (unset: that app is skipped)
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy (each GitHub environment has its own secrets and variables)
        type: choice
        options: [production, staging]
        default: production
      target:
        description: What to deploy
        type: choice
        options: [all, api, web, console, migrate-only]
        default: all
      skip_migrate:
        description: Skip database migrations (only when you know none are pending)
        type: boolean
        default: false
      urgent:
        description: Urgent fix — deploy even though ci / e2e-postgres did not pass on this commit (written to the run summary)
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  # Only a commit that passed the two required checks ships. Main's CI is never cancelled by a newer push
  # (ci.yml), so every main commit has a finished result; a run still going means "wait, then re-run".
  checks:
    name: checks (ci and e2e-postgres passed on this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Urgent deploy (checks not required)
        if: ${{ inputs.urgent }}
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::warning title=Deploy::urgent — ${GITHUB_SHA::7} ships without requiring ci and e2e-postgres"
          echo "### Urgent deploy: ${GITHUB_SHA::7} shipped without requiring ci and e2e-postgres (run by $ACTOR)" >> "$GITHUB_STEP_SUMMARY"
      - name: ci and e2e-postgres succeeded on this exact commit
        if: ${{ !inputs.urgent }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | {name, status, conclusion, started_at}')
          bad=()
          for name in ci e2e-postgres; do
            # A re-run adds a new check run: the newest one counts.
            latest=$(echo "$runs" | jq -rs --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.started_at) | last | if . == null then "missing" else "\(.status)/\(.conclusion // "")" end')
            case "$latest" in
              completed/success) echo "$name: success" ;;
              missing) bad+=("$name has no run on this commit") ;;
              completed/*) bad+=("$name ${latest#completed/}") ;;
              *) bad+=("$name is still running") ;;
            esac
          done
          {
            echo "### Required checks on ${SHA::7}"
            if [ ${#bad[@]} -eq 0 ]; then echo "ci and e2e-postgres passed."; else printf -- '- %s\n' "${bad[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#bad[@]} -gt 0 ]; then
            echo "::error title=Deploy refused::${SHA::7}: ${bad[*]}. Deploy a commit whose CI is green (or wait and re-run); an urgent fix: Run workflow with 'urgent' (docs/deploy/runbook.md)."
            exit 1
          fi

  plan:
    name: plan (which parts are configured)
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      db: ${{ steps.p.outputs.db }}
      api: ${{ steps.p.outputs.api }}
      web: ${{ steps.p.outputs.web }}
      console: ${{ steps.p.outputs.console }}
      vercel: ${{ steps.p.outputs.vercel }}
      migrate: ${{ steps.p.outputs.migrate }}
    steps:
      # GitHub falls back to repository-level secrets and variables when an environment lacks one, so a
      # half-configured staging could deploy with production's database. Staging must name itself.
      - name: Staging never reaches production
        if: ${{ (inputs.environment || 'production') == 'staging' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
          DATABASE_REF: ${{ vars.DATABASE_REF }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FLY_API_APP: ${{ vars.FLY_API_APP }}
          FLY_CONSOLE_APP: ${{ vars.FLY_CONSOLE_APP }}
          API_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          fail() { echo "::error title=Staging guard::$1 (docs/deploy/staging.md)"; exit 1; }
          [ "$DEPLOY_ENVIRONMENT" = staging ] || fail "the staging environment must set the variable DEPLOY_ENVIRONMENT=staging"
          [[ "$FLY_API_APP" == *-staging ]] || fail "FLY_API_APP must be set on the staging environment and end in -staging"
          [ -z "$FLY_CONSOLE_APP" ] || [[ "$FLY_CONSOLE_APP" == *-staging ]] || fail "FLY_CONSOLE_APP must end in -staging"
          [ -z "$API_URL" ] || [[ "$API_URL" == *staging* ]] || fail "API_PUBLIC_URL must be the staging API"
          if [ -n "$DIRECT_URL" ]; then
            [ -n "$DATABASE_REF" ] || fail "set DATABASE_REF (the staging Supabase project ref) on the staging environment"
            [[ "$DIRECT_URL" == *"$DATABASE_REF"* ]] || fail "DIRECT_URL is not the staging database (set it on the staging environment)"
          fi
      - id: p
        env:
          TARGET: ${{ inputs.target || 'all' }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate || false }}
          HAS_DB: ${{ secrets.DIRECT_URL != '' }}
          HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_VERCEL: ${{ secrets.VERCEL_DEPLOY_HOOK_CUSTOMER != '' || secrets.VERCEL_DEPLOY_HOOK_MERCHANT != '' }}
          API_URL: ${{ vars.API_PUBLIC_URL }}
          CONSOLE_APP: ${{ vars.FLY_CONSOLE_APP }}
        run: |
          want() { [ "$TARGET" = all ] || [ "$TARGET" = "$1" ]; }
          migrate=false; api=false; web=false; vercel=false; console=false
          if [ "$HAS_DB" = true ] && [ "$SKIP_MIGRATE" != true ] && { want api || [ "$TARGET" = migrate-only ]; }; then migrate=true; fi
          if [ "$HAS_FLY" = true ] && want api; then api=true; fi
          if [ "$HAS_CF" = true ] && [ -n "$API_URL" ] && want web; then web=true; fi
          if [ "$HAS_VERCEL" = true ] && want web; then vercel=true; fi
          if [ "$HAS_FLY" = true ] && [ -n "$CONSOLE_APP" ] && [ -n "$API_URL" ] && want console; then console=true; fi
          {
            echo "db=$HAS_DB"; echo "migrate=$migrate"; echo "api=$api"; echo "web=$web"; echo "vercel=$vercel"; echo "console=$console"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy plan (${{ inputs.environment || 'production' }}, target: $TARGET)"
            echo "| part | runs | why not |"
            echo "| --- | --- | --- |"
            echo "| migrate database | $migrate | $([ "$HAS_DB" = true ] || echo 'secret DIRECT_URL not set')$([ "$SKIP_MIGRATE" = true ] && echo 'skip_migrate chosen') |"
            echo "| API (Fly) | $api | $([ "$HAS_FLY" = true ] || echo 'secret FLY_API_TOKEN not set') |"
            echo "| web apps (Cloudflare Pages) | $web | $([ "$HAS_CF" = true ] || echo 'CLOUDFLARE_* secrets not set') $([ -n "$API_URL" ] || echo 'variable API_PUBLIC_URL not set') |"
            echo "| web apps (Vercel deploy hooks) | $vercel | $([ "$HAS_VERCEL" = true ] || echo 'VERCEL_DEPLOY_HOOK_* secrets not set') |"
            echo "| Console (Fly) | $console | $([ -n "$CONSOLE_APP" ] || echo 'variable FLY_CONSOLE_APP not set') |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$HAS_DB$HAS_FLY$HAS_CF$HAS_VERCEL" = falsefalsefalsefalse ] && echo "::notice title=Deploy::Nothing is configured yet — every part skipped (docs/deploy/runbook.md)." || true

  migrate:
    name: migrate database (prisma migrate deploy + harden + verify)
    needs: plan
    if: needs.plan.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 15
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@latest && corepack enable
      - name: Install (db package only)
        run: pnpm install --frozen-lockfile --filter=driver --filter=@driver/db...
      - name: Build @driver/db (prisma generate, real engines)
        run: pnpm turbo run build --filter=@driver/db
      - name: prisma migrate deploy
        run: pnpm --filter @driver/db exec prisma migrate deploy
      - name: Harden (RLS, revokes, partitions) and verify
        # No seed here: production data is never re-seeded by a deploy (the setup script seeds once).
        run: node scripts/deploy/supabase-setup.mjs --skip-migrate --skip-seed

  api:
    name: deploy API (Fly, fra)
    needs: [plan, migrate]
    if: ${{ !cancelled() && needs.plan.outputs.api == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_API_APP || 'driver-api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Build the image (Fly remote builder) and deploy blue-green
        run: |
          flyctl deploy . --config deploy/fly/api.toml --dockerfile apps/api/Dockerfile --app "$APP" \
            --remote-only --image-label "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" \
            --env APP_RELEASE="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
      - name: Smoke (health.live answers, health.ready → db ok)
        run: |
          # health.live is what Fly routes on: the process is up and its database answers. Redis down is a
          # warning, not a failed deploy: the API serves without it (queued work waits), and failing here
          # would only block the fix for it.
          base="https://${APP}.fly.dev/trpc"
          for _ in $(seq 1 30); do curl -fsS -o /dev/null "$base/health.live" 2>/dev/null && break; sleep 2; done
          curl -fsS "$base/health.live" | jq . || {
            echo "::error title=API smoke::$base/health.live did not answer 200 — roll back with docs/deploy/runbook.md"; exit 1; }
          body=$(curl -sS "$base/health.ready"); echo "$body" | jq .
          echo "$body" | jq -e '.result.data.json.db == "ok"' > /dev/null || {
            echo "::error title=API smoke::health.ready must report db: ok — roll back with docs/deploy/runbook.md"; exit 1; }
          echo "$body" | jq -e '.result.data.json.redis == "ok"' > /dev/null ||
            echo "::warning title=API smoke::health.ready reports redis not ok — the API serves, queued work waits; check the Redis app"
          # The installed apps still probe health.ping; it must keep answering.
          curl -fsS -o /dev/null "$base/health.ping" || {
            echo "::error title=API smoke::$base/health.ping did not answer"; exit 1; }

  console:
    name: deploy Console (Fly)
    needs: [plan, api]
    # After the API: only when it deployed and passed its smoke, or when this run does not deploy it.
    if: ${{ !cancelled() && needs.plan.outputs.console == 'true' && (needs.api.result == 'success' || (needs.api.result == 'skipped' && needs.plan.outputs.api != 'true')) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - run: |
          flyctl deploy . --config deploy/fly/console.toml --dockerfile apps/console/Dockerfile \
            --app "${{ vars.FLY_CONSOLE_APP }}" --remote-only \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.API_PUBLIC_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.SENTRY_DSN_CONSOLE || vars.SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_MAP_TILES_URL="$MAP_TILES_URL" \
            --build-arg NEXT_PUBLIC_MAP_GLYPHS_URL="$MAP_GLYPHS_URL"
        # The Golden hour map published by the Map tiles workflow on this environment's Supabase project
        # (docs/deploy/map.md). No DATABASE_REF → empty → the original map.
        env:
          MAP_TILES_URL: ${{ vars.DATABASE_REF && format('https://{0}.supabase.co/storage/v1/object/public/map/wasit.pmtiles', vars.DATABASE_REF) || '' }}
          MAP_GLYPHS_URL: ${{ vars.DATABASE_REF && format('https://{0}.supabase.co/storage/v1/object/public/map/fonts/{{fontstack}}/{{range}}.pbf', vars.DATABASE_REF) || '' }}

  web:
    name: deploy web (${{ matrix.app }})
    needs: [plan, api]
    # After the API: only when it deployed and passed its smoke, or when this run does not deploy it.
    if: ${{ !cancelled() && needs.plan.outputs.web == 'true' && (needs.api.result == 'success' || (needs.api.result == 'skipped' && needs.plan.outputs.api != 'true')) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            project_var: CF_PAGES_CUSTOMER
            sentry_var: SENTRY_DSN_CUSTOMER
          - app: partner
            project_var: CF_PAGES_PARTNER
            sentry_var: SENTRY_DSN_PARTNER
          - app: merchant
            project_var: CF_PAGES_MERCHANT
            sentry_var: SENTRY_DSN_MERCHANT
    env:
      PROJECT: ${{ vars[matrix.project_var] }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
      EXPO_PUBLIC_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL }}
      # Crash reports (docs/deploy/hosting.md "Logs and errors"); unset = none are sent.
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars[matrix.sentry_var] || vars.SENTRY_DSN }}
    steps:
      - name: Skip when no Pages project is named for this app
        if: env.PROJECT == ''
        run: echo "::notice title=web ${{ matrix.app }}::variable ${{ matrix.project_var }} not set — skipped"
      - uses: actions/checkout@v4
        if: env.PROJECT != ''
      - uses: actions/setup-node@v4
        if: env.PROJECT != ''
        with:
          node-version-file: .nvmrc
      - if: env.PROJECT != ''
        run: npm install --global corepack@latest && corepack enable
      - name: Install
        if: env.PROJECT != ''
        run: pnpm install --frozen-lockfile --filter=driver --filter=@driver/${{ matrix.app }}...
      - name: Build workspace packages
        if: env.PROJECT != ''
        run: pnpm turbo run build --filter=@driver/${{ matrix.app }}^...
      - name: expo export (web)
        if: env.PROJECT != ''
        run: pnpm --filter @driver/${{ matrix.app }} web:export
      - name: Check the bundle, write _headers (cache, SPA fallback)
        if: env.PROJECT != ''
        run: node scripts/deploy/prepare-web.mjs apps/${{ matrix.app }}/dist-web --api-url "$EXPO_PUBLIC_API_URL"
      - name: Upload to Cloudflare Pages
        if: env.PROJECT != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/dist-web --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true

  # The customer and restaurant websites on Vercel (docs/deploy/vercel.md). Their projects do not deploy on
  # a push (vercel.json): this job asks Vercel to build them, after the API passed its smoke. A deploy hook
  # builds the newest commit of main, so the job refuses any other commit rather than ship the wrong one.
  web-vercel:
    name: deploy web (Vercel)
    needs: [plan, api]
    if: ${{ !cancelled() && needs.plan.outputs.vercel == 'true' && (needs.api.result == 'success' || (needs.api.result == 'skipped' && needs.plan.outputs.api != 'true')) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 5
    env:
      HOOK_CUSTOMER: ${{ secrets.VERCEL_DEPLOY_HOOK_CUSTOMER }}
      HOOK_MERCHANT: ${{ secrets.VERCEL_DEPLOY_HOOK_MERCHANT }}
    steps:
      - name: This commit is the newest on main (what a deploy hook builds)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          [ "$main" = "$GITHUB_SHA" ] || {
            echo "::error title=web (Vercel)::${GITHUB_SHA::7} is not the newest commit on main (${main::7}); a deploy hook would build ${main::7}. Tag main's newest commit, or deploy target web from main."
            exit 1; }
      - name: Trigger the deploy hooks
        run: |
          hook() {
            if [ -z "$2" ]; then echo "::notice title=web $1::secret VERCEL_DEPLOY_HOOK_${1^^} not set — skipped"; return; fi
            curl -fsS -X POST "$2" | jq -r --arg app "$1" '"\($app): Vercel build \(.job.state) (job \(.job.id))"'
          }
          hook customer "$HOOK_CUSTOMER"
          hook merchant "$HOOK_MERCHANT"
          echo "Vercel builds main ${GITHUB_SHA::7}; the Web live check runs on the new deployment (.github/workflows/web-smoke.yml)." >> "$GITHUB_STEP_SUMMARY"
