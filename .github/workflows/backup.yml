# Driver (درايفر) — nightly logical backup of the production database (docs/deploy/runbook.md, "Backups").
#
# Supabase Pro already keeps daily physical backups (7 days) and offers PITR as an add-on; this is the
# independent copy you own: `pg_dump` of our two schemas (public, identity_vault), encrypted with your
# passphrase, kept 14 days as a workflow artifact and — when the BACKUP_S3_* secrets are set — copied
# to an S3-compatible bucket you control (Cloudflare R2 recommended: no egress fees).
# Until production exists it skips with a notice. Once it does (the repository variable API_PUBLIC_URL
# is set, as the Deploy workflow needs), missing secrets fail the run red (SEC-13).
# The repository is public, so by default the encrypted dump is not kept as a workflow artifact (anyone
# signed in to GitHub could download it): it goes to the bucket, which is then required. On a private
# repository, the variable BACKUP_KEEP_ARTIFACT=true keeps a 14-day copy in GitHub as well.
#
# Secrets: DIRECT_URL (same as deploy), BACKUP_PASSPHRASE (long random; keep it in your password
# manager — without it a backup cannot be opened), optional BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
# BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY.
name: Backup

on:
  schedule:
    # 01:17 UTC = 04:17 Baghdad, after the nightly ledger close and before the morning.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      PRODUCTION_LIVE: ${{ vars.API_PUBLIC_URL != '' }}
      # Only a private repository may keep the encrypted dump as an artifact: set the variable then.
      KEEP_ARTIFACT: ${{ vars.BACKUP_KEEP_ARTIFACT == 'true' }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          missing=()
          [ -n "$DIRECT_URL" ] || missing+=(DIRECT_URL)
          [ -n "$BACKUP_PASSPHRASE" ] || missing+=(BACKUP_PASSPHRASE)
          # Without the artifact (the default) the bucket is the only copy.
          if [ "$KEEP_ARTIFACT" != true ] && { [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ]; }; then missing+=(BACKUP_S3_ENDPOINT/BACKUP_S3_BUCKET); fi
          if [ ${#missing[@]} -eq 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [ "$PRODUCTION_LIVE" = true ]; then
            echo "::error title=Backup::production is live but ${missing[*]} not set: no backup was made (docs/deploy/runbook.md, Backups)"
            exit 1
          fi
          echo "::notice title=Backup::${missing[*]} not set and production not live yet — skipped"

      - name: Install pg_dump 17 (must be >= the server's major version)
        if: steps.cfg.outputs.run == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump (custom format) and encrypt
        if: steps.cfg.outputs.run == 'true'
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          file="driver-${stamp}.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DIRECT_URL" --format=custom --no-owner --no-acl \
            --schema=public --schema=identity_vault --file="$file"
          /usr/lib/postgresql/17/bin/pg_restore --list "$file" | grep -c "TABLE DATA" | xargs -I{} echo "tables with data: {}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$file" -out "$file.enc" -pass env:BACKUP_PASSPHRASE
          rm -f "$file"
          sha256sum "$file.enc" | tee "$file.enc.sha256"
          echo "FILE=$file.enc" >> "$GITHUB_ENV"

      - name: Keep 14 days in GitHub (only with BACKUP_KEEP_ARTIFACT, on a private repository)
        if: steps.cfg.outputs.run == 'true' && env.KEEP_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: |
            ${{ env.FILE }}
            ${{ env.FILE }}.sha256
          retention-days: 14

      - name: Copy to your bucket
        if: steps.cfg.outputs.run == 'true' && env.S3_ENDPOINT != '' && env.S3_BUCKET != ''
        run: |
          aws s3 cp "$FILE" "s3://${S3_BUCKET}/driver/$(date -u +%Y/%m)/$FILE" --endpoint-url "$S3_ENDPOINT"
          aws s3 cp "$FILE.sha256" "s3://${S3_BUCKET}/driver/$(date -u +%Y/%m)/$FILE.sha256" --endpoint-url "$S3_ENDPOINT"
