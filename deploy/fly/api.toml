# Driver API on Fly.io, Frankfurt — next to Supabase eu-central-1 (docs/deploy/hosting.md).
# Deploy from the repository root (the workflow does this):
#   flyctl deploy . --config deploy/fly/api.toml --dockerfile apps/api/Dockerfile --remote-only
# Secrets (never in this file): flyctl secrets set --config deploy/fly/api.toml DATABASE_URL=… (list in hosting.md).
# Change `app` if the name is taken; keep it in sync with FLY_API_APP in GitHub (docs/deploy/runbook.md).

app = "driver-api"
primary_region = "fra"
# src/shutdown.ts handles SIGTERM: stop accepting, finish requests (10 s), drain the outbox, close
# BullMQ workers, exit — 25 s at most, under this kill timeout.
kill_signal = "SIGTERM"
kill_timeout = 30

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_FORMAT = "json"
  # Fly's proxy is one hop: req.ip is the client (OTP limits per IP).
  TRUST_PROXY = "1"
  # Supavisor transaction mode: keep the per-instance pool small (Micro compute allows ~200 pooled clients).
  DATABASE_POOL_MAX = "10"

[http_service]
  internal_port = 3000
  force_https = true
  # BullMQ workers (outbox, dispatch waves, order timers, nightly close) live in this process:
  # the machine must never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # SSE / WebSocket streams hold a connection each: count connections, not requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/trpc/health.ping"

[deploy]
  # The new machine boots and passes /trpc/health.ping before the old one gets SIGTERM: no downtime
  # with a single machine. For those seconds both run BullMQ workers, which is safe (jobs are claimed
  # once; the outbox uses SKIP LOCKED).
  strategy = "bluegreen"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
