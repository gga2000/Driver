    <linearGradient id="taxi-sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E3D0"/>
    </linearGradient>
    <radialGradient id="taxi-tyre" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5A3220"/>
      <stop offset="1" stop-color="#2A170C"/>
    </radialGradient>
    <linearGradient id="taxi-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6D3BC"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="201" rx="96" ry="10" fill="#6B2E14" opacity=".16"/>
