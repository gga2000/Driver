  <path d="M22 158c-2-17 8-29 26-32l34-6 18-31c4-7 10-10 18-10h48c8 0 14 3 18 10l18 30c18 4 28 14 28 32v14c0 8-5 13-13 13H36c-9 0-14-5-14-13z" fill="url(#taxi-body)"/>
