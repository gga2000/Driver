  <circle cx="172" cy="178" r="3.5" fill="#B9B2A6"/>
  <path d="M55 167c3-4 7-6 11-6M159 167c3-4 7-6 11-6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".35" fill="none"/>
