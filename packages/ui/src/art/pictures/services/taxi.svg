  <circle cx="68" cy="176" r="26" fill="#6B2E14" opacity=".9"/>
  <circle cx="172" cy="176" r="26" fill="#6B2E14" opacity=".9"/>
  <circle cx="68" cy="178" r="22" fill="url(#taxi-tyre)"/>
  <circle cx="172" cy="178" r="22" fill="url(#taxi-tyre)"/>
  <circle cx="68" cy="178" r="10" fill="url(#taxi-hub)"/>
  <circle cx="172" cy="178" r="10" fill="url(#taxi-hub)"/>
