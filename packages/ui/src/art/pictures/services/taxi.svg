<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="taxi-body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFD94A"/>
      <stop offset="0.55" stop-color="#F7C21A"/>
      <stop offset="1" stop-color="#E9A300"/>
    </linearGradient>
    <linearGradient id="taxi-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F38A1B"/>
      <stop offset="1" stop-color="#D96F0E"/>
