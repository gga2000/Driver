<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="food-bag" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F1E3D0"/>
    </linearGradient>
    <linearGradient id="food-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E3D0"/>
      <stop offset="1" stop-color="#E0CBAF"/>
    </linearGradient>
    <linearGradient id="food-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F38A1B"/>
    </linearGradient>
    <linearGradient id="food-inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B2E14"/>
      <stop offset="1" stop-color="#2A170C"/>
    </linearGradient>
    <linearGradient id="food-wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D08A"/>
      <stop offset="1" stop-color="#E3A04B"/>
    </linearGradient>
    <linearGradient id="food-cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#D93A2B"/>
    </linearGradient>
    <linearGradient id="food-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC46A"/>
      <stop offset="1" stop-color="#2E8B3E"/>
    </linearGradient>
  </defs>
  <ellipse cx="122" cy="204" rx="84" ry="11" fill="#6B2E14" opacity=".16"/>
  <!-- steam -->
  <path d="M92 52c-8-8 8-14 0-24M110 46c-8-8 8-14 0-22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85"/>
  <!-- bag back rim / opening -->
  <path d="M46 98l22-16h120l-22 16z" fill="url(#food-inside)"/>
  <!-- drink cup -->
  <path d="M146 58l20-26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M146 58l20-26" stroke="#1A9AA8" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M128 60h36l-4 44h-28z" fill="url(#food-cup)"/>
  <rect x="124" y="54" width="44" height="10" rx="5" fill="#FFF8EF"/>
  <path d="M136 72v24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <!-- kebab wrap -->
  <path d="M68 104l18-44c3-8 12-11 20-8l10 4c8 3 11 12 8 20l-14 32z" fill="url(#food-wrap)"/>
  <path d="M86 60c3-8 12-11 20-8l10 4c8 3 11 12 8 20" fill="#9C4A20"/>
  <path d="M90 58c4-4 10-5 16-3" stroke="#5CC46A" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="114" cy="62" r="4.5" fill="#F0503A"/>
  <path d="M82 84l20 8M76 98l18 7" stroke="#C9822F" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
  <path d="M84 74l6-12" stroke="#FFF1CF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- bag front -->
  <path d="M46 98h120v88c0 6-4 10-10 10H56c-6 0-10-4-10-10z" fill="url(#food-bag)"/>
  <!-- bag side -->
  <path d="M166 98l22-16v86c0 5-2 8-6 11l-16 13z" fill="url(#food-side)"/>
  <!-- saffron band -->
  <path d="M46 118h120v30H46z" fill="url(#food-band)"/>
  <path d="M166 118l22-16v30l-22 16z" fill="#D96F0E"/>
  <!-- simple dish emblem (cloche) on band -->
  <path d="M92 142c0-10 7-17 14-17s14 7 14 17z" fill="#FFF8EF"/>
  <rect x="88" y="141" width="36" height="4" rx="2" fill="#FFF8EF"/>
  <circle cx="106" cy="123" r="2.6" fill="#FFF8EF"/>
  <!-- shine -->
  <path d="M56 108v66" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M60 162c10 4 20 5 30 5" stroke="#E6D3BC" stroke-width="3" stroke-linecap="round" fill="none"/>
