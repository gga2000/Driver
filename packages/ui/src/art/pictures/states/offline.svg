<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="offline-phone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8A4424"/>
      <stop offset="1" stop-color="#4A2412"/>
    </linearGradient>
    <linearGradient id="offline-screen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE7C4"/>
    </linearGradient>
    <linearGradient id="offline-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E3D0"/>
    </linearGradient>
    <linearGradient id="offline-wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F38A1B"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="206" rx="64" ry="9" fill="#6B2E14" opacity=".14"/>
  <!-- cloud behind -->
  <path d="M140 74c-2-18 12-32 30-32 14 0 25 8 29 20 13 0 23 9 23 21s-10 21-23 21h-52c-12 0-21-8-21-19 0-8 6-14 14-11z" fill="url(#offline-cloud)"/>
  <path d="M158 56c4-4 10-6 16-5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- phone -->
  <rect x="68" y="48" width="92" height="156" rx="18" fill="url(#offline-phone)"/>
  <rect x="76" y="62" width="76" height="126" rx="10" fill="url(#offline-screen)"/>
  <rect x="104" y="54" width="20" height="4" rx="2" fill="#2A170C"/>
  <path d="M72 70v100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".25"/>
  <!-- wifi: dot and two whole waves -->
  <circle cx="114" cy="158" r="7" fill="url(#offline-wave)"/>
  <path d="M101.3 145.3A18 18 0 0 1 126.7 145.3" stroke="url(#offline-wave)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M91.4 135.4A32 32 0 0 1 136.6 135.4" stroke="url(#offline-wave)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- outer wave broken: left piece in place, right piece drifting away -->
  <path d="M81.5 125.5A46 46 0 0 1 102.1 113.6" stroke="#F38A1B" stroke-width="8" stroke-linecap="round" fill="none" opacity=".6"/>
  <path d="M136 100A46 46 0 0 1 156 109" stroke="#F38A1B" stroke-width="8" stroke-linecap="round" fill="none" opacity=".45" transform="rotate(14 146 104)"/>
  <!-- gentle drifting dots -->
  <circle cx="160" cy="118" r="3.5" fill="#FFB547" opacity=".6"/>
  <circle cx="170" cy="126" r="2.5" fill="#FFB547" opacity=".45"/>
  <!-- small cloud in front -->
  <path d="M40 112c0-10 8-17 17-17 7 0 13 4 16 10 8 0 14 6 14 13s-6 13-14 13H44c-8 0-14-5-14-11 0-5 4-9 10-8z" fill="url(#offline-cloud)"/>
</svg>
