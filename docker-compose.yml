# Local infrastructure for Driver (درايفر) — plan §0.2.
# `pnpm db:up` starts both; the API is the only client of either.
# Mirrors the CI service containers (.github/workflows/ci.yml, docs/ci.md).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: driver-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: driver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - driver-pg:/var/lib/postgresql/data
    configs:
      # Empty `driver_shadow` database for `pnpm db:drift` (SHADOW_DATABASE_URL). Init scripts run only
      # on a fresh volume; for an existing one: docker compose exec postgres createdb -U postgres driver_shadow
      - source: shadow-db
        target: /docker-entrypoint-initdb.d/20-shadow-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d driver']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: driver-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - driver-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

configs:
  shadow-db:
    # Inline config content needs Docker Compose >= 2.23.1.
    content: |
      CREATE DATABASE driver_shadow;

volumes:
  driver-pg:
  driver-redis:
