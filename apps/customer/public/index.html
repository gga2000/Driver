<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable web app ("Add to home screen"). Icons: scripts/web-icons.mjs; colours: src/lib/web-shell.test.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="درايفر" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Fonts (speed w3): Arabic + Latin woff2 from scripts/fonts/subset-web-fonts.py; the two main weights start at once. -->
    <link rel="preload" href="/assets/fonts/plex-400.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/plex-600.v1.woff2" as="font" type="font/woff2" crossorigin />
    <style id="driver-fonts">
      @font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; font-display: swap; src: url(/assets/fonts/plex-400.v1.woff2) format("woff2"); }
      @font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 500 600; font-display: swap; src: url(/assets/fonts/plex-600.v1.woff2) format("woff2"); }
      @font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 700; font-display: swap; src: url(/assets/fonts/plex-700.v1.woff2) format("woff2"); }
      @font-face { font-family: "Alexandria"; font-weight: 700; font-display: swap; src: url(/assets/fonts/alexandria-700.v1.woff2) format("woff2"); }
      @font-face { font-family: "Marhey"; font-weight: 700; font-display: swap; src: url(/assets/fonts/marhey-700.v1.woff2) format("woff2"); }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
